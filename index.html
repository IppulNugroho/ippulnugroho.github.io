<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0; 
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 100px;
            width: 100%;
            max-width: 1000px;
            transition: all 0.3s ease; 
        }
        .profile-picture-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #fff;
            overflow: hidden;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .profile-picture {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info p {
            margin: 5px 0 25px 0;
            font-size: 1em;
            color: #666;
            line-height: 1.5;
        }
        .social-links a {
            margin: 0 10px;
            text-decoration: none;
        }
        .social-links img {
            width: 32px;
            height: 32px;
            transition: all 0.3s ease;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            .profile-picture-container {
                width: 120px;
                height: 120px;
            }
            .info p {
                font-size: 0.9em;
            }
            .social-links img {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-picture-container">
            <img src="wadpul/source/DSC00264.jpg" alt="Foto Masing-masing" class="profile-picture">
        </div>

        <div class="info">
             <p style="font-size: large;"><b>Giri Pulung Nugroho / 102022400284 / Fakultas Rekayasa Industri / S1 Sistem Informasi</b></p>
        </div>

        <div class="social-links">
            <a href="https://www.x.com/" target="_blank">
                <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/x.svg" alt="X Icon">
            </a>
            <a href="https://www.github.com/" target="_blank">
                <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/github.svg" alt="Github Icon">
            </a>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/instagram.svg" alt="Instagram Icon">
            </a>
        </div>
    </div>
</body>
</html>
